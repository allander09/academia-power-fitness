<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard de chamados de suporte técnico">
  <title>Dashboard de Chamados</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div>
      <p class="subtitulo">Central de Suporte</p>
      <h1>Dashboard de Chamados</h1>
      <p class="descricao-topo">Acompanhe os chamados abertos, em andamento e finalizados.</p>
    </div>

    <button id="btn-resetar" class="btn btn-secundario" type="button">Restaurar dados</button>
  </header>

  <main class="container">
    <section class="resumo" aria-label="Resumo dos chamados">
      <article class="kpi">
        <span>Total de chamados</span>
        <strong id="contador-total">0</strong>
      </article>

      <article class="kpi kpi-aberto">
        <span>Abertos</span>
        <strong id="contador-aberto">0</strong>
      </article>

      <article class="kpi kpi-andamento">
        <span>Em andamento</span>
        <strong id="contador-andamento">0</strong>
      </article>

      <article class="kpi kpi-finalizado">
        <span>Finalizados</span>
        <strong id="contador-finalizado">0</strong>
      </article>
    </section>

    <section class="filtros" aria-label="Filtros do dashboard">
      <div class="campo-filtro">
        <label for="busca">Buscar chamado</label>
        <input id="busca" type="search" placeholder="Digite título, responsável ou setor..." autocomplete="off">
      </div>

      <div class="campo-filtro">
        <label for="filtro-prioridade">Prioridade</label>
        <select id="filtro-prioridade">
          <option value="todas">Todas</option>
          <option value="Baixa">Baixa</option>
          <option value="Média">Média</option>
          <option value="Alta">Alta</option>
          <option value="Crítica">Crítica</option>
        </select>
      </div>
    </section>

    <section class="quadro" aria-label="Quadro de chamados por status">
      <section class="coluna coluna-aberto" aria-labelledby="titulo-aberto">
        <header class="cabecalho-coluna">
          <div>
            <span class="indicador indicador-aberto"></span>
            <h2 id="titulo-aberto">Aberto</h2>
          </div>
          <span id="badge-aberto" class="contador-coluna">0</span>
        </header>
        <div id="lista-aberto" class="lista-chamados"></div>
      </section>

      <section class="coluna coluna-andamento" aria-labelledby="titulo-andamento">
        <header class="cabecalho-coluna">
          <div>
            <span class="indicador indicador-andamento"></span>
            <h2 id="titulo-andamento">Em andamento</h2>
          </div>
          <span id="badge-andamento" class="contador-coluna">0</span>
        </header>
        <div id="lista-andamento" class="lista-chamados"></div>
      </section>

      <section class="coluna coluna-finalizado" aria-labelledby="titulo-finalizado">
        <header class="cabecalho-coluna">
          <div>
            <span class="indicador indicador-finalizado"></span>
            <h2 id="titulo-finalizado">Finalizado</h2>
          </div>
          <span id="badge-finalizado" class="contador-coluna">0</span>
        </header>
        <div id="lista-finalizado" class="lista-chamados"></div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
