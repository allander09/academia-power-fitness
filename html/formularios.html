<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Power Fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/formularios.css">
</head>
<body>
  <main class="container">
    <a class="voltar" href="index.html">← Voltar ao início</a>
    <h1>Crie sua conta</h1><p class="subtitulo-form">Comece sua jornada na Power Fitness.</p>
    <form id="cadastroForm">
      <label for="nome">Nome completo</label><input type="text" id="nome" autocomplete="name" required>
      <label for="email">E-mail</label><input type="email" id="email" autocomplete="email" required>
      <label for="telefone">Telefone</label><input type="tel" id="telefone" autocomplete="tel" pattern="[0-9 ()+\-]{8,20}" required>
      <label for="senha">Senha</label><input type="password" id="senha" autocomplete="new-password" minlength="6" required>
      <button type="submit">Cadastrar</button>
      <p id="feedbackCadastro" class="feedback" aria-live="polite" hidden></p>
    </form>
  </main>
  <script type="module" src="../js/formularios.js"></script>
</body>
</html>
