<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planos | Power Fitness</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/plano.css"><link rel="stylesheet" href="../css/modal.css">
</head>
<body>
  <header class="cabecalho-interno"><h1>Planos Power Fitness</h1><a href="index.html">← Voltar</a></header>
  <main>
    <section class="planos-pagina">
      <article class="card"><h2>Básico</h2><p class="preco">R$ 89,90</p><p>Musculação e avaliação física</p><button type="button" onclick="selecionarPlano('Plano Básico', 89.90)">Escolher</button></article>
      <article class="card destaque-plano"><h2>Premium</h2><p class="preco">R$ 149,90</p><p>Musculação, funcional e cardio</p><button type="button" onclick="selecionarPlano('Plano Premium', 149.90)">Escolher</button></article>
      <article class="card"><h2>VIP</h2><p class="preco">R$ 199,90</p><p>Acesso total e personal trainer</p><button type="button" onclick="selecionarPlano('Plano VIP', 199.90)">Escolher</button></article>
    </section>
    <section class="calculadora">
      <h2>Calculadora de mensalidade</h2>
      <label for="planoNome">Plano escolhido</label><input type="text" id="planoNome" readonly placeholder="Escolha um plano acima">
      <input type="hidden" id="planoValor">
      <label for="personal">Adicionar personal</label><select id="personal"><option value="0">Não</option><option value="60">Sim — R$ 60/mês</option></select>
      <label for="nutri">Adicionar nutricionista</label><select id="nutri"><option value="0">Não</option><option value="80">Sim — R$ 80/mês</option></select>
      <label for="quantidadeMeses">Meses</label><input type="number" id="quantidadeMeses" min="1" max="36" value="1">
      <button type="button" onclick="calcular()">Calcular total</button>
      <p id="resultado" class="mensagem" aria-live="polite"></p>
    </section>
  </main>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="tituloPlano"><div class="modal-content"><button type="button" class="fechar" onclick="fecharModal()" aria-label="Fechar">&times;</button><h2 id="tituloPlano"></h2><p id="descricaoPlano"></p></div></div>
  <script src="../js/modal.js"></script><script src="../js/mensalidade.js"></script>
</body>
</html>
