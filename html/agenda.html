<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento | Power Fitness</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/agendamento.css">
</head>
<body>
  <header class="cabecalho-interno"><h1>Aula experimental</h1><a href="index.html">← Voltar</a></header>
  <main class="agendamento">
    <h2>Agende sua aula</h2>
    <form id="agendamentoForm">
      <label for="nome">Nome</label><input type="text" id="nome" name="nome" autocomplete="name" required>
      <label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="email" required>
      <label for="data">Data</label><input type="date" id="data" name="data" required>
      <label for="plano">Plano de interesse</label><select id="plano" name="plano"><option>Plano Básico</option><option>Plano Premium</option><option>Plano VIP</option><option>Ainda não decidi</option></select>
      <button type="submit">Solicitar agendamento</button>
      <p id="msg" class="mensagem" aria-live="polite"></p>
    </form>
  </main>
  <script type="module" src="../js/agendamento.js"></script>
</body>
</html>
