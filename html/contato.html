<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Power Fitness</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/contato.css">
</head>
<body>
  <header class="cabecalho-interno"><h1>Contato</h1><a href="index.html">← Voltar</a></header>
  <main class="contato">
    <form id="formContato">
      <h2>Fale conosco</h2>
      <label for="nome">Nome</label><input type="text" id="nome" name="nome" autocomplete="name" required>
      <label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="email" required>
      <label for="telefone">Telefone</label><input type="tel" id="telefone" name="telefone" autocomplete="tel">
      <label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem" rows="5" minlength="10" maxlength="1000" required></textarea>
      <label class="consentimento"><input type="checkbox" required> Concordo com a <a href="privacidade.html">Política de Privacidade</a>.</label>
      <button type="submit">Enviar mensagem</button>
      <p id="retorno" class="mensagem" aria-live="polite"></p>
    </form>
  </main>
  <script type="module" src="../js/contato.js"></script>
</body>
</html>
